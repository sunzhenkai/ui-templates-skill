schema_version: 2
components:
  - id: app-shell
    semantic: application shell
    source: custom+shadcn
    rule_ids: [NN-001, NN-002, LAYOUT-005, AX-007]
    states: [default, resized]
  - id: sidebar
    semantic: nav
    source: custom
    rule_ids: [AX-007, AX-008, AX-012, NN-003, RESP-001]
    keyboard: Tab / Enter 链接；折叠项 Tooltip
    icon_only: 折叠与 overlay 触发器有 aria-label
  - id: page-header
    semantic: header + h1
    source: custom
    rule_ids: [AX-013, AX-016, LAYOUT-004]
  - id: toolbar
    semantic: toolbar
    source: custom
    rule_ids: [AX-013, RESP-002]
  - id: button
    semantic: button
    source: shadcn
    rule_ids: [AX-001, AX-002, AX-006, NN-012]
    variants: [default, outline, brand, brandSubtle, secondary, ghost, destructive, link]
  - id: command-palette
    semantic: dialog + listbox
    source: shadcn command
    rule_ids: [AX-046, AX-050, LAYOUT-002]
  - id: dialog
    semantic: dialog
    source: shadcn
    rule_ids: [AX-046, AX-050]
  - id: sheet
    semantic: dialog
    source: shadcn
    rule_ids: [AX-046, AX-050, ROUTE-003]
  - id: table
    semantic: table
    source: shadcn
    rule_ids: [AX-017, AX-022, NN-016]
  - id: board
    semantic: list + article cards
    source: custom + dnd-kit
    rule_ids: [NN-014, QUALITY-011]
    states: [dragging, empty]
  - id: input
    semantic: input/textarea
    source: shadcn
    rule_ids: [AX-031, AX-035]
  - id: select
    semantic: combobox
    source: shadcn
    rule_ids: [AX-031]
  - id: checkbox
    semantic: checkbox
    source: shadcn
    rule_ids: [AX-035]
  - id: switch
    semantic: switch
    source: shadcn
    rule_ids: [AX-035]
  - id: slider
    semantic: slider
    source: shadcn
    rule_ids: [AX-031]
  - id: tabs
    semantic: tablist
    source: shadcn
    rule_ids: [AX-041, AX-045, RESP-003]
  - id: badge
    semantic: status text
    source: shadcn
    rule_ids: [AX-036, NN-008]
  - id: skeleton
    semantic: presentation
    source: shadcn
    rule_ids: [AX-056, NN-015]
  - id: empty-state
    semantic: status
    source: shadcn Empty
    rule_ids: [AX-051, AX-054, ROUTE-004]
  - id: toast
    semantic: status
    source: sonner
    rule_ids: [LAYOUT-009]
  - id: calendar
    semantic: grid
    source: shadcn
    rule_ids: [AX-013]
  - id: metric-card
    semantic: button + heading
    source: custom
    rule_ids: [ROUTE-009, AX-026]
  - id: chart
    semantic: img/group
    source: recharts + shadcn chart
    rule_ids: [NN-008]
  - id: floating-chat-fab
    semantic: button opens dialog
    source: custom
    rule_ids: [AX-061, AX-064, LAYOUT-008]
  - id: progress
    semantic: progressbar
    source: shadcn
    rule_ids: [TOKEN-007]
  - id: avatar
    semantic: img
    source: shadcn
    rule_ids: [AX-006]
negative_facts:
  - no nested button-in-button in collection rows
  - faint-foreground not used for body text
  - root does not scroll
