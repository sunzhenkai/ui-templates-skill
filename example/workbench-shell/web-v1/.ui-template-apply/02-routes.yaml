schema_version: 2
scroll_owner: page-mode-internal
root: { height: 100svh, overflow: hidden }
shell_modes:
  expanded: { min: 1280, nav: persistent-expanded }
  collapsed: { min: 1024, max: 1279, nav: persistent-icon }
  overlay: { max: 1023, nav: header-trigger-sheet }
  narrow: { max: 767, note: still web overlay, not native mobile }
routes:
  - id: inbox
    path: /:workspaceId/inbox
    page_mode: B
    rule_ids: [ROUTE-006, ROUTE-001, ROUTE-004]
    url_params: [q, type, severity, status, page, pageSize, item]
    scroll_owner: collection
    entry: sidebar-personal
  - id: incidents
    path: /:workspaceId/incidents
    page_mode: A
    rule_ids: [ROUTE-005, ROUTE-001, RESP-006]
    url_params: [q, status, severity, service, page, pageSize]
    scroll_owner: collection
  - id: incident-detail
    path: /:workspaceId/incidents/:incidentId
    page_mode: D
    rule_ids: [ROUTE-008, NN-001]
    scroll_owner: timeline
  - id: board
    path: /:workspaceId/board
    page_mode: A
    rule_ids: [ROUTE-005, NN-014]
    url_params: [scope, severity, owner, service]
    scroll_owner: column
  - id: services
    path: /:workspaceId/services
    page_mode: A
    rule_ids: [ROUTE-005, RESP-005]
    url_params: [view, q, health, team, env]
    scroll_owner: collection
  - id: service-detail
    path: /:workspaceId/services/:serviceId
    page_mode: B
    rule_ids: [ROUTE-006]
    scroll_owner: detail
  - id: oncall
    path: /:workspaceId/oncall
    page_mode: A
    rule_ids: [ROUTE-005]
    url_params: [view, date, team]
    scroll_owner: collection
  - id: analytics
    path: /:workspaceId/analytics
    page_mode: E
    rule_ids: [ROUTE-009, RESP-005]
    url_params: [range, severity]
    scroll_owner: collection
  - id: settings
    path: /:workspaceId/settings
    page_mode: C
    rule_ids: [ROUTE-007, ROUTE-002, RESP-003]
    url_params: [tab]
    scroll_owner: settings-content
    tab_history: replace
constraints:
  - id: region-shell
    type: region
    rule_ids: [LAYOUT-005, NN-002]
  - id: arrangement-sidebar-canvas
    type: arrangement
    rule_ids: [NN-003, RESP-001]
  - id: fill-canvas
    type: fill
    rule_ids: [LAYOUT-007]
  - id: shrink-header-actions
    type: shrink
    rule_ids: [NN-017, RESP-002]
  - id: wrap-settings-tabs
    type: wrap
    rule_ids: [RESP-003]
  - id: scroll-mode-internal
    type: scroll
    rule_ids: [NN-001, LAYOUT-001]
  - id: overlay-nav-sheet
    type: overlay
    rule_ids: [ROUTE-003, AX-050]
  - id: responsive-web-matrix
    type: responsive
    rule_ids: [RESP-001]
invalid:
  - not-found-incident
  - not-found-service
  - filtered-empty
