schema_version: 2
phase_5:
  slice: inbox + app-shell
  routes: [/ws-alpha/inbox]
  states: [loading, data, empty, error]
  rule_ids: [NN-001, NN-014, NN-015, LAYOUT-004, RESP-001, ROUTE-004]
  notes: 代表切片覆盖 shell、URL item 详情、骨架、键盘搜索 ⌘K、1440/1100/900 视口。
phase_6:
  routes:
    - /:workspaceId/inbox
    - /:workspaceId/incidents
    - /:workspaceId/incidents/:incidentId
    - /:workspaceId/board
    - /:workspaceId/services
    - /:workspaceId/services/:serviceId
    - /:workspaceId/oncall
    - /:workspaceId/analytics
    - /:workspaceId/settings
  excluded_not_forged: [native-mobile, native-desktop, legacy-doc-detail]
  rule_ids: [ROUTE-005, ROUTE-006, ROUTE-007, ROUTE-008, ROUTE-009, RESP-003, RESP-005, RESP-006]
phase_7:
  systems: [command-search, create-incident, confirm-dialog, toast, nav-progress, help-fab, shortcuts]
  rule_ids: [LAYOUT-002, LAYOUT-008, LAYOUT-009, TOKEN-007, AX-061, AX-064]
tests:
  unit: pnpm test
  e2e: pnpm test:e2e
  build: pnpm build
evidence_refs:
  - evidence/phase8-computed-inbox-1440.json
  - evidence/inbox-1440-light.png
