schema: oracle-deployment/v1
oracle:
  kind: git-revision
  revision: 200dcb44cc1527ef24a1c892e9c3e5508377b386
deployment:
  cwd: /home/wii/code/repos/github/sunzhenkai/ui-templates-skill/governance/candidates/workbench-shell-recapture/certification/clean-build-v2
  serve: python3 -m http.server 4299 --bind 127.0.0.1
  ready_url: http://127.0.0.1:4299
  ready_timeout_seconds: 300
capture:
  settle_ms: 6000
  full_page: true
  routes:
  - id: app-shell
    path: /demo/issues
  - id: workspace-board
    path: /demo/issues?__oracle_action=board
  - id: settings-section-nav
    path: /demo/settings
  - id: master-detail
    path: /demo/issues/DEMO-1
  - id: overlay-dialog
    path: /demo/issues?__oracle_action=open-new-issue
  viewports:
  - id: desktop
    width: 1440
    height: 900
  themes:
  - light
  measurements:
  - id: oracle-app-shell-surface
    route: app-shell
    viewport: desktop
    theme: light
    selector: '[data-slot="sidebar-wrapper"]'
    property: backgroundColor
    dimension: surface
    unit: css-color
    tolerance: exact
    oracle_revision: 200dcb44cc1527ef24a1c892e9c3e5508377b386
  - id: oracle-workspace-board-header-height
    route: workspace-board
    viewport: desktop
    theme: light
    selector: header
    property: height
    dimension: spacing
    unit: px
    tolerance: <=2px
    oracle_revision: 200dcb44cc1527ef24a1c892e9c3e5508377b386
  - id: oracle-settings-nav-width
