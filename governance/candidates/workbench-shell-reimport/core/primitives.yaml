schema: design-system-primitives/v1
items:
- id: primitive/nav-item
  name: Sidebar navigation item
  anatomy:
  - {slot: icon, order: 0}
  - {slot: label, order: 1}
  context_bindings:
    sidebar: {selected: token/color.light.sidebar-accent, hover: token/color.light.sidebar-accent}
    page-surface: {selected: token/color.light.surface-selected, hover: token/color.light.surface-hover}
  variants:
  - default
  - active
  states:
  - default
  - hover
  - focus-visible
  - active
  - disabled
  token_refs:
  - token/color.light.sidebar-accent
  - token/color.light.sidebar-accent-foreground
  - token/space.2
  - token/radius.md
  rule_refs:
  - rule/LAYOUT-101
  - rule/QUALITY-101
- id: primitive/button
  name: Button
  anatomy:
  - {slot: label, order: 0}
  variant_contracts:
    default: {presentation: filled, radius: token/radius.lg, control_height: token/size.control-md, hover: token/color.light.primary-hover, focus_ref: rule/QUALITY-104}
    outline: {presentation: outline, radius: token/radius.lg, control_height: token/size.control-md, hover: token/color.light.surface-hover, focus_ref: rule/QUALITY-104}
    brand: {presentation: filled, radius: token/radius.lg, control_height: token/size.control-md, hover: token/color.light.brand-subtle-hover, focus_ref: rule/QUALITY-104}
    ghost: {presentation: ghost, radius: token/radius.lg, control_height: token/size.control-md, hover: token/color.light.surface-hover, focus_ref: rule/QUALITY-104}
    destructive: {presentation: filled, radius: token/radius.lg, control_height: token/size.control-md, hover: token/color.light.destructive-surface-hover, focus_ref: rule/QUALITY-104}
  variants:
  - default
  - primary
  - outline
  - brand
  - brand-subtle
  - secondary
  - ghost
  - destructive
  - link
  sizes:
  - xs
  - sm
  - md
  - lg
  - icon-xs
  - icon-sm
  - icon-lg
  states:
  - default
  - hover
  - focus-visible
  - active
  - disabled
  token_refs:
  - token/color.light.primary
  - token/color.light.primary-foreground
  - token/color.light.ring
  - token/radius.md
  - token/color.light.primary-hover
  - token/color.light.brand
  - token/color.light.brand-subtle
  - token/color.light.destructive-surface
  - token/color.light.ring-focus
  - token/typography.body
  - token/size.control-md
  - token/size.control-sm
  - token/size.icon-sm
  rule_refs:
  - rule/AX-101
- id: primitive/input
  name: Text input
  variant_contracts:
    text: {presentation: plain, radius: token/radius.lg, control_height: token/size.control-md, focus_ref: rule/QUALITY-104}
  states:
  - default
  - hover
  - focus-visible
  - disabled
  token_refs:
  - token/color.light.input
  - token/color.light.ring
  - token/radius.md
  - token/color.light.ring-focus
  - token/typography.body
  - token/size.control-md
  rule_refs:
  - rule/AX-101
  variants:
  - text
  - select
  - combobox
  - checkbox
  - radio
  - switch
- id: primitive/panel
  name: Bounded surface panel
  states:
  - default
  token_refs:
  - token/color.light.surface
  - token/color.light.surface-border
  - token/shadow.surface
  - token/space.4
  rule_refs:
