schema: design-system-patterns/v1
items:
  - id: pattern/workbench-shell
    name: Inset workbench shell
    primitives: [primitive/app-sidebar, primitive/page-header, primitive/chat-fab, primitive/command-palette]
    page_type: page-type/workbench
    rule_refs: [rule/LAYOUT-001, rule/LAYOUT-107]
  - id: pattern/board-columns
    name: Horizontally scrolling board columns
    primitives: [primitive/data-table, primitive/button, primitive/page-header]
    page_type: page-type/board
    rule_refs: [rule/LAYOUT-002, rule/LAYOUT-106, rule/AX-101]
  - id: pattern/settings-navigation
    name: Settings navigation and content
    primitives: [primitive/settings-nav, primitive/input]
    page_type: page-type/settings
    rule_refs: [rule/LAYOUT-102, rule/QUALITY-103, rule/QUALITY-104]
  - id: pattern/master-detail
    name: Master-detail panes
    primitives: [primitive/app-sidebar]
    page_type: page-type/master-detail
    rule_refs: [rule/LAYOUT-003]
  - id: pattern/dialog-overlay
    name: Viewport dialog overlay
    primitives: [primitive/dialog]
    page_type: page-type/dialog
    rule_refs: [rule/LAYOUT-005, rule/QUALITY-001, rule/QUALITY-102]
