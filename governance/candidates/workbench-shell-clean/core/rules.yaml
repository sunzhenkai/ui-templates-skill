schema: design-system-rules/v1
items:
- id: rule/LAYOUT-101
  statement: App shell uses an inset page canvas with ordered workspace-switcher, search, compose, nav-group, pin-list, rail, header-trigger, footer-utility, chat-fab, page-header, page-toolbar and page-canvas slots.
  severity: must
  token_refs:
  - token/color.app-shell
  - token/color.page-canvas
  - token/color.sidebar
  - token/color.sidebar-border
  status: active
- id: rule/LAYOUT-102
  statement: The inset page canvas uses a tokenized gap, radius, border, shadow and surface background; these values come only from tokens.yaml.
  severity: must
  token_refs:
  - token/space.content-gap
  - token/radius.content
  - token/color.surface-border
  - token/shadow.surface
  - token/color.page-canvas
  status: active
- id: rule/LAYOUT-103
  statement: Collection content scrolls inside its content region and keeps row width stable; the root shell does not scroll.
  severity: must
  token_refs:
  - token/color.surface
  - token/color.surface-border
  - token/space.page-gutter
  status: active
- id: rule/LAYOUT-104
  statement: Board columns fill their pane and own block scrolling; cards remain readable at compact widths without wrapping the column controls.
  severity: must
  token_refs:
  - token/color.surface
  - token/color.surface-border
  - token/radius.surface
  status: active
- id: rule/LAYOUT-105
  statement: Master-detail pages use separate master-pane and detail-pane scroll domains, with an optional context panel.
  severity: must
  token_refs:
  - token/color.surface
  - token/color.surface-border
  - token/radius.surface
  status: active
- id: rule/LAYOUT-106
  statement: Dialogs are region-scoped overlays anchored to the viewport, not page-flow containers.
  severity: must
  token_refs:
  - token/color.surface-raised
  - token/shadow.floating
  - token/radius.dialog
  status: active
- id: rule/QUALITY-101
  statement: Interactive cards and buttons use tokenized hover, active and border treatments; status is never communicated by color alone.
  severity: should
  token_refs:
  - token/color.surface
  - token/color.surface-hover
  - token/color.surface-border
  - token/radius.control
  status: active
- id: rule/QUALITY-102
  statement: Dialog content keeps complete four-sided padding, a tokenized radius and the floating shadow.
  severity: must
  token_refs:
  - token/space.dialog-padding
  - token/radius.dialog
  - token/shadow.floating
  status: active
- id: rule/QUALITY-103
  statement: Navigation, empty, loading and tooltip surfaces use semantic surface/foreground tokens and preserve readable contrast.
  severity: should
  token_refs:
  - token/color.sidebar-foreground
  - token/color.sidebar-accent
  - token/color.muted-foreground
  - token/color.surface-raised
  status: active
- id: rule/AX-101
  statement: Navigation items expose a visible focus-visible border or ring and remain keyboard reachable.
  severity: must
  token_refs:
  - token/color.sidebar-ring
  - token/shadow.focus
  status: active
- id: rule/AX-102
  statement: Buttons expose a visible focus-visible border or ring and retain a disabled state.
  severity: must
  token_refs:
  - token/color.ring
  - token/shadow.focus
  status: active
- id: rule/AX-103
  statement: Inputs expose a visible focus-visible border or ring and a programmatic label.
  severity: must
  token_refs:
  - token/color.ring
  - token/shadow.focus
  status: active
- id: rule/AX-104
  statement: Tabs and selects expose visible focus treatments and a non-color selected state.
  severity: must
  token_refs:
  - token/color.ring
  - token/color.surface-selected
  - token/shadow.focus
  status: active
