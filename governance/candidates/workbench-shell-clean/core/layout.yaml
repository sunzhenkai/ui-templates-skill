schema: design-system-layout/v1
items:
- id: route/dashboard-shell
  name: Dashboard shell
  page_type: page-type/dashboard
  slots:
  - workspace-switcher
  - search
  - compose
  - nav-group
  - pin-list
  - rail
  - header-trigger
  - footer-utility
  - chat-fab
  - page-header
  - page-toolbar
  - page-canvas
  breakpoints:
  - compact
  - desktop
  - wide
  rule_refs:
  - rule/LAYOUT-101
  - rule/LAYOUT-102
  placement:
    id: scene.shell
    shell_variant: inset
    regions:
    - id: region.shell.root
      role: root
    - id: region.shell.workspace-switcher
      role: workspace-switcher
      parent: region.shell.root
    - id: region.shell.search
      role: search
      parent: region.shell.root
    - id: region.shell.compose
      role: compose
      parent: region.shell.root
    - id: region.shell.nav-group
      role: nav-group
      parent: region.shell.root
    - id: region.shell.pin-list
      role: pin-list
      parent: region.shell.root
    - id: region.shell.rail
      role: rail
      parent: region.shell.root
    - id: region.shell.header-trigger
      role: header-trigger
      parent: region.shell.root
    - id: region.shell.footer-utility
      role: footer-utility
      parent: region.shell.root
    - id: region.shell.chat-fab
      role: chat-fab
      parent: region.shell.root
    - id: region.shell.page-header
      role: page-header
      parent: region.shell.root
    - id: region.shell.page-toolbar
      role: page-toolbar
      parent: region.shell.root
    - id: region.shell.page-canvas
      role: page-canvas
      parent: region.shell.root
    slots:
    - id: slot.shell.workspace-switcher
      role: workspace-switcher
      region: region.shell.workspace-switcher
      order: 0
    - id: slot.shell.search
      role: search
      region: region.shell.search
      order: 1
    - id: slot.shell.compose
      role: compose
      region: region.shell.compose
      order: 2
    - id: slot.shell.nav-group
      role: nav-group
      region: region.shell.nav-group
      order: 3
    - id: slot.shell.pin-list
      role: pin-list
      region: region.shell.pin-list
      order: 4
    - id: slot.shell.rail
      role: rail
      region: region.shell.rail
      order: 5
    - id: slot.shell.header-trigger
      role: header-trigger
      region: region.shell.header-trigger
      order: 6
    - id: slot.shell.footer-utility
      role: footer-utility
      region: region.shell.footer-utility
      order: 7
    - id: slot.shell.chat-fab
      role: chat-fab
      region: region.shell.chat-fab
      order: 8
    - id: slot.shell.page-header
      role: page-header
      region: region.shell.page-header
      order: 9
    - id: slot.shell.page-toolbar
      role: page-toolbar
      region: region.shell.page-toolbar
      order: 10
    - id: slot.shell.page-canvas
      role: page-canvas
      region: region.shell.page-canvas
      order: 11
    relations:
    - type: contains
      from: region.shell.root
      to: region.shell.workspace-switcher
      order: 0
    - type: contains
      from: region.shell.root
      to: region.shell.search
      order: 1
    - type: contains
      from: region.shell.root
      to: region.shell.compose
      order: 2
    - type: contains
      from: region.shell.root
      to: region.shell.nav-group
      order: 3
    - type: contains
      from: region.shell.root
      to: region.shell.pin-list
      order: 4
    - type: contains
      from: region.shell.root
      to: region.shell.rail
      order: 5
    - type: contains
      from: region.shell.root
      to: region.shell.header-trigger
      order: 6
    - type: contains
      from: region.shell.root
      to: region.shell.footer-utility
      order: 7
    - type: contains
      from: region.shell.root
      to: region.shell.chat-fab
      order: 8
    - type: contains
      from: region.shell.root
      to: region.shell.page-header
      order: 9
    - type: contains
      from: region.shell.root
      to: region.shell.page-toolbar
      order: 10
    - type: contains
      from: region.shell.root
      to: region.shell.page-canvas
      order: 11
    scroll_domains:
    - id: scroll.shell.canvas
      axis: block
      owner: region.shell.page-canvas
      nested_in: null
    responsive_modes:
    - id: mode.compact
      viewport: compact
    - id: mode.desktop
      viewport: desktop
    - id: mode.wide
      viewport: wide
    geometry:
    - id: geometry.shell.canvas-gap
      role: content-gap
      token: token/space.content-gap
    - id: geometry.shell.canvas-radius
      role: content-radius
      token: token/radius.content
    pattern_refs:
    - pattern/app-shell
    evidence_refs:
    - evidence-layout-shell
- id: route/collection-board
  name: Collection board
  page_type: page-type/collection
  slots:
  - content
  - column
  - card
  breakpoints:
  - compact
  - desktop
  - wide
  rule_refs:
  - rule/LAYOUT-103
  - rule/LAYOUT-104
  placement:
    id: scene.board
    regions:
    - id: region.board.root
      role: root
    - id: region.board.content
      role: content
      parent: region.board.root
    - id: region.board.column
      role: column
      parent: region.board.root
    slots:
    - id: slot.board.content
      role: content
      region: region.board.content
      order: 0
    - id: slot.board.column
      role: column
      region: region.board.column
      order: 1
    - id: slot.board.card
      role: card
      region: region.board.column
      order: 2
    relations:
    - type: contains
      from: region.board.root
      to: region.board.content
      order: 0
    - type: contains
      from: region.board.root
      to: region.board.column
      order: 1
    - type: horizontal
      from: region.board.content
      to: region.board.column
      order: 2
    scroll_domains:
    - id: scroll.board.column
      axis: block
      owner: region.board.column
      nested_in: null
    responsive_modes:
    - id: mode.compact
      viewport: compact
    - id: mode.desktop
      viewport: desktop
    - id: mode.wide
      viewport: wide
    pattern_refs:
    - pattern/collection-table
    - pattern/board-view
    evidence_refs:
    - evidence-layout-board
- id: route/detail-document
  name: Detail document
  page_type: page-type/detail
  slots:
  - master-pane
  - detail-pane
  - context-panel
  breakpoints:
  - compact
  - desktop
  - wide
  rule_refs:
  - rule/LAYOUT-105
  placement:
    id: scene.master-detail
    regions:
    - id: region.detail.root
      role: root
    - id: region.detail.master
      role: master-pane
      parent: region.detail.root
    - id: region.detail.detail
      role: detail-pane
      parent: region.detail.root
    - id: region.detail.context
      role: context-panel
      parent: region.detail.root
    slots:
    - id: slot.detail.master
      role: master-pane
      region: region.detail.master
      order: 0
    - id: slot.detail.detail
      role: detail-pane
      region: region.detail.detail
      order: 1
    - id: slot.detail.context
      role: context-panel
      region: region.detail.context
      order: 2
    relations:
    - type: contains
      from: region.detail.root
      to: region.detail.master
      order: 0
    - type: contains
      from: region.detail.root
      to: region.detail.detail
      order: 1
    - type: horizontal
      from: region.detail.master
      to: region.detail.detail
      order: 1
    - type: vertical
      from: region.detail.detail
      to: region.detail.context
      order: 2
    scroll_domains:
    - id: scroll.detail.master
      axis: block
      owner: region.detail.master
      nested_in: null
    - id: scroll.detail.detail
      axis: block
      owner: region.detail.detail
      nested_in: null
    responsive_modes:
    - id: mode.compact
      viewport: compact
    - id: mode.desktop
      viewport: desktop
    - id: mode.wide
      viewport: wide
    pattern_refs:
    - pattern/master-detail
    - pattern/settings-form
    evidence_refs:
    - evidence-layout-detail
- id: route/modal-task
  name: Modal task
  page_type: page-type/modal
  slots:
  - content
  breakpoints:
  - compact
  - desktop
  - wide
  rule_refs:
  - rule/LAYOUT-106
  - rule/QUALITY-102
  placement:
    id: scene.dialog
    regions:
    - id: region.dialog.root
      role: root
    - id: region.dialog.content
      role: content
      parent: region.dialog.root
    slots:
    - id: slot.dialog.content
      role: content
      region: region.dialog.content
      order: 0
    relations:
    - type: contains
      from: region.dialog.root
      to: region.dialog.content
      order: 0
    - type: overlay
      from: region.dialog.root
      to: region.dialog.content
      order: 1
    scroll_domains: []
    responsive_modes:
    - id: mode.compact
      viewport: compact
    - id: mode.desktop
      viewport: desktop
    - id: mode.wide
      viewport: wide
    geometry:
    - id: geometry.dialog.padding
      role: content-padding
      token: token/space.dialog-padding
    - id: geometry.dialog.radius
      role: content-radius
      token: token/radius.dialog
    pattern_refs:
    - pattern/create-dialog
    - pattern/search-command
    evidence_refs:
    - evidence-layout-dialog
