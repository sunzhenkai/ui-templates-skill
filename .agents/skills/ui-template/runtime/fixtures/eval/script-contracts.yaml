schema_version: 1
cases:
  authoring-updates-index:
    assertions:
      - type: ordered_contains
        path: skills/ui-template/SKILL.md
        values: ["### 1. Generate", "### 2. Validate", "### 3. Eval", "### 4. Index", "### 5. Report"]
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["templates/INDEX.md", "模板路径", "default/estimated 摘要", "coverage", "任何 gate 失败即停止"]
  no-apply-handoff-after-authoring:
    assertions:
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["用模板实现页面/搭后台", "移交 `ui-template-apply`"]
        none: ["本 skill 同时实现消费项目页面"]
  tokens-yaml-required-and-complete:
    assertions:
      - type: path_exists
        path: schemas/template/v2/tokens.schema.json
      - type: file_contains
        path: skills/ui-template/references/spec-format.md
        all: ["tokens.yaml", "颜色、字体、字号、间距、圆角、阴影、动效等精确值只在本文件维护", "value", "origin", "双主题角色键必须一致"]
      - type: json_schema_validity
        schema: schemas/template/v2/tokens.schema.json
        valid: true
        instance: {schema_version: 2, themes: {light: {background: {value: "#ffffff", origin: source}}}}
  authoring-normalizes-and-fills-defaults:
    assertions:
      - type: file_contains
        path: skills/ui-template/references/source-web.md
        all: ["近义色合并", "字号/间距收敛", "default", "basis"]
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["coverage", "Validate", "对比度"]
  no-engineering-structure-in-template:
    assertions:
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["模板不得包含 `implementation/`", "工程目录", "API/mock/data", "状态库"]
      - type: file_contains
        path: skills/ui-template/references/spec-format.md
        all: ["`apply/` 只归模板 Authoring 所有", ".ui-template-apply/03-structure.md"]
  doc-source-routed-correctly:
    assertions:
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["Markdown/PDF 设计文档", "source-doc.md"]
      - type: file_contains
        path: skills/ui-template/references/source-doc.md
        all: ["缺口 token 填完整 default", "layout、visual、components 分维度记录", "视觉"]
        none: ["按 repo 来源处理"]
  authoring-out-of-scope-rejected:
    assertions:
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["本 skill 只创建、迁移、更新和索引 UI 模板，不实现消费项目页面", "移交 `ui-template-apply`"]
  apply-requires-reference-reading:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all: ["template-contract.md", "apply-workflow.md", "toolchain.md", "quality-gates.md"]
      - type: file_contains
        path: skills/ui-template/SKILL.md
        all: ["runtime/run_contract_evals.py", "scripts/run_contract_evals.py", "UI_TEMPLATE_EVAL_RUNNER"]
  no-apply-without-template:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all: ["没有模板", "停止", "禁止猜测", "Authoring 由 `ui-template` 所有"]
  no-phase-skipping:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/references/apply-workflow.md
        all: ["阶段不可跳过", "最早失效 phase", "token semantic digest 变化 → 最早 Phase 1", "Phase 8 缺失"]
      - type: path_exists
        path: scripts/check_template_apply_state.py
  browser-verification-evidence:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/references/quality-gates.md
        all: ["真实 Accessibility tree", "computed style", "console", "current-build", "evidence refs", "included route"]
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all: ["真实浏览器", "Phase 8"]
  spec-wins-over-apply:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/references/template-contract.md
        all: ["`spec.md` 是设计规则入口", "发现冲突时，以较高层为准", "创建 feedback"]
      - type: file_contains
        path: skills/ui-template/references/feedback-lifecycle.md
        all: ["accepted", "known-gap", "rejected", "applied", "verified", "UUID", "fingerprint"]
  routing-semantics-enforced:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/references/quality-gates.md
        all: ["跨页目的地为 link", "当前项语义", "可恢复状态", "URL"]
  apply-token-freeze:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/references/apply-workflow.md
        all: ["所有可消费 token 已映射", "不得从 prose 重演精确值", "偏离含 rule ID、理由、确认"]
      - type: json_schema_validity
        schema: schemas/template/v2/tokens.schema.json
        valid: false
        error_contains: "source | computed | estimated | default"
        instance: {schema_version: 2, themes: {light: {background: {value: "#ffffff", origin: observed}}}}
  apply-out-of-scope-rejected:
    assertions:
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all: ["本 skill 只消费已有模板，不创建、迁移或索引模板", "移交 `ui-template`"]
