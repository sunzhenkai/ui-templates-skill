version: 1
skill: ui-template
cases:
  - id: apply-requires-reference-reading
    kind: basic
    judge: deterministic
    description: Template Apply 执行前必须完整阅读工作流、工具链、质量门禁与模板 spec。
    given: 用户要求使用已有模板实现页面
    expect:
      must:
        - 执行前已读取 references/apply-workflow.md
        - 执行前已读取 references/toolchain.md
        - 执行前已读取 references/quality-gates.md
        - 执行前已读取 templates/<name>/spec.md
      must_not:
        - 未读上述文件即开始实现页面
  - id: authoring-updates-index
    kind: core
    judge: deterministic
    description: Authoring 完成后必须更新 templates/INDEX.md 并汇报模板路径、关键 token 与估算值。
    given: 完成一个模板的 Authoring
    expect:
      must:
        - templates/INDEX.md 包含新模板行（名称/风格描述/来源类型/采集日期）
        - 汇报包含模板路径、关键 token 摘要、估算值说明
      must_not: []
  - id: no-apply-without-template
    kind: failure
    judge: deterministic
    description: 没有可用模板时必须先进入 Authoring，不得直接生成页面。
    given: 用户要求照某风格做页面但 templates/ 中无对应模板
    expect:
      must:
        - 先执行 Template Authoring 创建或扩展模板
        - 创建完成后向用户确认是否继续 Apply
      must_not:
        - 在无模板时直接生成页面
  - id: no-phase-skipping
    kind: core
    judge: deterministic
    description: Apply 的 0-9 阶段不得跳过或提前。
    given: Template Apply 进行中且前一阶段产物未确认
    expect:
      must:
        - 每阶段先产出核心产物再进入下一阶段
      must_not:
        - token 与 layout 未确认时生成页面
        - 跳过 Browser verification 宣称完成
  - id: browser-verification-evidence
    kind: core
    judge: deterministic
    description: 完成宣称必须附带真实浏览器验证证据。
    given: 一次 Template Apply 即将收尾
    expect:
      must:
        - 提供桌面、compact、mobile 多视口检查
        - console 无未处理错误
        - 可访问性树与 computed style 匹配模板 token
      must_not:
        - 仅以代码审查宣称完成
  - id: estimated-values-labeled
    kind: failure
    judge: deterministic
    description: 反推或估算值必须标注 (估算)，不得冒充精确值。
    given: 从图片反推色值或字号
    expect:
      must:
        - 估算值后标注 (估算)
      must_not:
        - 将估算值表述为精确值而不注明出处
  - id: existing-template-ask-update-or-new
    kind: boundary
    judge: deterministic
    description: 目标模板目录已存在时必须询问更新还是另建。
    given: 用户要求创建 templates/<name>/ 且该目录已存在
    expect:
      must:
        - 询问用户是更新现有模板还是另建新模板
      must_not:
        - 未经确认直接覆盖已有模板内容
  - id: spec-wins-over-implementation
    kind: boundary
    judge: deterministic
    description: spec.md 与 implementation/ 冲突时以 spec.md 为准。
    given: 模板 implementation/ 说明与 spec.md 规则冲突
    expect:
      must:
        - 按 spec.md 规则执行
        - 向用户说明冲突与裁决依据
      must_not:
        - 按 implementation/ 覆盖 spec.md 规则
  - id: routing-semantics-enforced
    kind: core
    judge: deterministic
    description: 路由入口使用真实链接，当前项使用 aria-current，可恢复状态进入 URL。
    given: 实现跨页面导航与可恢复状态
    expect:
      must:
        - 跨页面目的地使用真实 <a href>
        - 当前导航项含 aria-current="page"
        - 可恢复状态进入 URL
      must_not:
        - 用脚本模拟导航替代真实链接
  - id: out-of-scope-rejected
    kind: boundary
    judge: deterministic
    description: 与 UI 风格、布局模板或模板消费无关的任务不使用本 skill。
    given: 请求与 UI 模板无关
    expect:
      must:
        - 判定不适用本 skill 并说明原因
      must_not:
        - 强行套用模板工作流
