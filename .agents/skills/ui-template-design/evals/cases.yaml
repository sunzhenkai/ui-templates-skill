schema_version: 1
skill: ui-template-design
revision: expand-design-decision-gates-eval-v1
cases:
  - id: design-standalone-complete
    skill: ui-template-design
    category: installation
    description: 只装 Design、无 Author/Apply/模板时仍可完成 freeze gate。
    given: 消费项目仅安装 ui-template-design，用户要求建立前端设计系统且未提供模板
    fixture: skills/ui-template-design/evals/contracts.yaml#design-standalone-complete
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - 夹具不含 Author/Apply/templates/catalog
        - 合法 freeze 可通过 gate
        - SKILL 声明缺少模板或另外两个 skill 不是失败
      must_not:
        - 因缺少 Author、Apply、catalog 或 templates/ 停止
    revision: expand-design-decision-gates-eval-v1
  - id: design-primitives-not-complete
    skill: ui-template-design
    category: validation-gate
    description: 仅有 Primitive、没有 Pattern 不得 freeze 完成。
    given: freeze 声明 primitives 为真而 patterns 为假
    fixture: skills/ui-template-design/evals/contracts.yaml#design-primitives-not-complete
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - primitives-only 被 gate 阻断
        - SKILL 写明仅有 Primitive 不算完成
      must_not:
        - 停在组件库初始化即宣称完成
    revision: expand-design-decision-gates-eval-v1
  - id: design-raw-token-fail
    skill: ui-template-design
    category: schema
    description: raw palette 扫描失败；无模板时写 INDEX 失败；越界 output_root 失败。
    given: 输出根含 text-gray-500，或 freeze.touched_paths 含 templates/INDEX.md，或 output_root 含 ..
    fixture: skills/ui-template-design/evals/contracts.yaml#design-raw-token-fail
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - raw palette 扫描失败
        - 无模板时禁止 INDEX
        - 非法 output_root 被 schema 拒绝
      must_not:
        - 扫描失败仍 freeze
    revision: expand-design-decision-gates-eval-v1
  - id: design-no-freeze-apply-optional
    skill: ui-template-design
    category: routing
    description: Apply 无 freeze 时保持现行工作流；Design 完成不要求 Apply Phase 8。
    given: 消费项目没有 design freeze，或 Design 会话只冻结体制
    fixture: skills/ui-template-design/evals/contracts.yaml#design-no-freeze-apply-optional
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - Apply 无 freeze 走现行 Phase 0–9
        - Design 不要求 Apply Phase 8
      must_not:
        - 把缺少 Design 当成 Apply 失败
    revision: expand-design-decision-gates-eval-v1
  - id: design-handoff-author
    skill: ui-template-design
    category: routing
    description: 做成模板的请求移交 Author；Author 把设计系统请求移交 Design。
    given: 用户要求抽取并发布 schema v2 模板，或要求建立项目 Design System 且不要做成模板
    fixture: skills/ui-template-design/evals/contracts.yaml#design-handoff-author
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - Design 移交 ui-template-author
        - Author 识别设计系统请求并移交 Design
      must_not:
        - Design Index 模板
    revision: expand-design-decision-gates-eval-v1
  - id: design-handoff-apply
    skill: ui-template-design
    category: routing
    description: 按模板实现页面移交 Apply，且不得假装已实现业务页。
    given: 用户要求用已有 published 模板实现产品页面
    fixture: skills/ui-template-design/evals/contracts.yaml#design-handoff-apply
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - 移交 ui-template-apply
        - 未实现业务页时不得假装完成页面
      must_not:
        - 在 Design 流程里画业务 CRUD 页
    revision: expand-design-decision-gates-eval-v1
  - id: design-task-classes
    skill: ui-template-design
    category: routing
    description: 用可观察信号判定 bootstrap/refactor/iterate；digest 不匹配或范围未声明则停止。
    given: freeze 为 frozen 且 digest 匹配，或无 freeze 时输出根空/已有代码，或用户只说优化 UI 未给范围
    fixture: skills/ui-template-design/evals/contracts.yaml#design-task-classes
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    expect:
      must:
        - 三类任务类可判定
        - digest 不匹配与范围未声明被阻断
        - iterate 不得加载完整 inventory
      must_not:
        - 凭用户口吻猜测任务类
    revision: expand-design-decision-gates-eval-v1
  - id: design-decision-gates
    skill: ui-template-design
    category: validation-gate
    description: 影响 freeze 本体的决策必须展示候选、影响与授权来源。
    given: 用户请求建立或重构 Design System，但未声明栈方向、视觉方向、范围或验证矩阵
    fixture: skills/ui-template-design/evals/contracts.yaml#design-decision-gates
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    revision: expand-design-decision-gates-eval-v1
    expect:
      must:
        - SKILL 指向 decision gates
        - 每个 blocking 决策至少有两个候选并说明影响
        - 用户授权可替代选择且必须记录 authority
      must_not:
        - 把框架默认或 Agent 偏好当作用户确认
  - id: design-scanner-gate-extended
    skill: ui-template-design
    category: validation-gate
    description: 扫描器覆盖 raw spacing/motion；gate 校验 digest 一致性与 Gallery 存在。
    given: 输出根含 p-[17px] 或 transition-all；freeze digest 不匹配或 gallery=true 但无 07-gallery.yaml
    fixture: skills/ui-template-design/evals/contracts.yaml#design-scanner-gate-extended
    fixture_sha256: 58d6a797be144b6f8258671749187ca7beb47c6df783b9e022557b7f331d7f70
    judge: script
    revision: expand-design-decision-gates-eval-v1
    expect:
      must:
        - raw spacing 扫描失败
        - raw motion 扫描失败
        - digest 不匹配被 gate 阻断
        - gallery 缺失被 gate 阻断
      must_not:
        - raw spacing 或 motion 存在仍 freeze
