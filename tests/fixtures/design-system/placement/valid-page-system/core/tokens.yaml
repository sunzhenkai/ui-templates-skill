schema: design-system-tokens/v1
tokens:
  color:
    primary:
      value: '#2563eb'
      origin: source
    surface:
      value: '#ffffff'
      origin: source
    text-primary:
      value: '#0f172a'
      origin: default
      description: Primary body text color.
  space:
    md:
      value: 16
      unit: px
      origin: source
  radius:
    lg:
      value: 10
      unit: px
      origin: default
  size:
    control-height-default:
      value: 32
      unit: px
      origin: default
    control:
      sm:
        value: 28
        unit: px
        origin: default
        description: Control height sm (button/input/select).
      md:
        value: 32
        unit: px
        origin: computed
        description: Control height md; alias of size.control-height-default.
      lg:
        value: 40
        unit: px
        origin: default
        description: Control height lg (button/input/select).
    touch-min:
      value: 44
      unit: px
      origin: default
      description: Minimum touch/hit target on coarse pointers (WCAG 2.5.5 / platform HIG).
  typography:
    body:
      value: 14
      unit: px
      line_height: 20
      line_height_unit: px
      origin: default
  font:
    family:
      sans:
        value: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif
        origin: default
        description: 'Body/UI font stack: Latin face, CJK fallbacks (macOS/Windows/Linux), generic family last.'
      mono:
        value: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono CJK SC", monospace'
        origin: default
        description: Monospace stack with CJK-capable fallback.
  icon:
    library:
      value: fixture-icons
      origin: default
    stroke-width:
      value: 2
      unit: unitless
      origin: default
    size:
      default:
        value: 16
        unit: px
        origin: default
color_pairs:
- foreground: token/color.text-primary
  background: token/color.surface
  min_ratio: 4.5
