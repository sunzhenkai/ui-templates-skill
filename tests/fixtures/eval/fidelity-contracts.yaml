schema_version: 1
cases:
  fidelity-portable-structural:
    assertions:
      - type: command_json
        program: validate_templates
        paths:
          - tests/fixtures/fidelity/structural/templates
        index: tests/fixtures/fidelity/structural/templates/INDEX.md
        expected_exit: 0
        json_path_equals:
          - path: [exit_code]
            value: 0
          - path: [templates, 0, fidelity, conformance]
            value: structural
          - path: [templates, 0, fidelity, profile]
            value: repo-structural-v1
          - path: [templates, 0, fidelity, replay, status]
            value: not-run
          - path: [discovery, example_excluded]
            value: true
        json_path_gte:
          - path: [templates, 0, fidelity, counts, layout_scenes, total]
            value: 1
          - path: [templates, 0, fidelity, counts, component_geometry, total]
            value: 1
          - path: [templates, 0, fidelity, counts, state_presentations, total]
            value: 1
        json_path_contains:
          - path: [discovery, exclusions]
            value: example/**
      - type: file_contains
        path: skills/ui-template/references/spec-format.md
        all: ["fidelity.yaml", "repo-structural-v1", "精确值唯一载体"]
        none: []
  fidelity-legacy-baseline:
    assertions:
      - type: python_call
        operation: validate_mutated_profile
        path: tests/fixtures/fidelity/structural/templates
        mutations:
          - id: delete-sidecar
            kind: delete_sidecar
        json_path_equals:
          - path: [results, 0, failed]
            value: false
          - path: [results, 0, conformance]
            value: legacy-baseline
  fidelity-unknown-fail-closed:
    assertions:
      - type: python_call
        operation: validate_mutated_profile
        path: tests/fixtures/fidelity/structural/templates
        mutations:
          - id: unknown-profile
            kind: replace_sidecar
            sidecar: tests/fixtures/fidelity/unknown-profile.yaml
            finding: FIDELITY_PROFILE_UNSUPPORTED
        json_path_equals:
          - path: [results, 0, failed]
            value: true
          - path: [results, 0, present]
            value: true
  fidelity-canonical-stable:
    assertions:
      - type: python_call
        operation: canonical_digest_file
        path: tests/fixtures/fidelity/structural/templates/structural-template/fidelity.yaml
        json_path_equals:
          - path: [stable]
            value: true
  fidelity-negative-mutations:
    assertions:
      - type: python_call
        operation: validate_mutated_profile
        path: tests/fixtures/fidelity/structural/templates
        mutations:
          - id: dialog-padding
            kind: delete
            path: [component_geometry, 0, properties, padding_block_start]
            finding: FIDELITY_GEOMETRY_INCOMPLETE
          - id: navigation-underline
            kind: append_state_conflict
            finding: FIDELITY_STATE_CONFLICT
          - id: scroll-owner
            kind: append_scroll_owner
            value:
              id: scroll.board.inline
              axis: inline
              owner: region.board.root
              nested_in: null
            finding: FIDELITY_SCROLL_OWNER_NOT_UNIQUE
          - id: dangling-token
            kind: set
            path: [component_geometry, 0, properties, gap]
            value: {kind: token-ref, value: spacing.missing.token}
            finding: FIDELITY_TOKEN_DANGLING
        json_path_equals:
          - path: [all_failed]
            value: true
  fidelity-capture-reproducibility:
    assertions:
      - type: python_call
        operation: capture_reproducibility
        source: tests/fixtures/repo-capture/source
        request: tests/fixtures/repo-capture/capture-request.yaml
        json_path_equals:
          - path: [status]
            value: captured
          - path: [repeatable]
            value: true
          - path: [profile_repeatable]
            value: true
          - path: [unresolved]
            value: false
          - path: [conformance]
            value: structural
  fidelity-example-exclusion:
    assertions:
      - type: python_call
        operation: example_path_rejected
        json_path_equals:
          - path: [code]
            value: EXAMPLE_PATH_IN_SCOPE
        json_path_contains:
          - path: [exclusions]
            value: example/**
  apply-fidelity-projections:
    assertions:
      - type: python_call
        operation: project_ids
        path: tests/fixtures/fidelity/structural/templates/structural-template/fidelity.yaml
        json_path_equals:
          - path: [layout_stable]
            value: true
          - path: [scenario_stable]
            value: true
        json_path_contains:
          - path: [geometry]
            value: geometry:dialog:content:padding_block_start:token-ref:spacing.dialog.block-start
      - type: file_contains
        path: skills/ui-template-apply/references/template-contract.md
        all: ["fidelity.yaml", "legacy-baseline", "repo-structural-v1", "negative facts"]
        none: []
  apply-fidelity-facet-recovery:
    assertions:
      - type: python_call
        operation: facet_recovery
        path: tests/fixtures/fidelity/structural/templates/structural-template/fidelity.yaml
        json_path_equals:
          - path: [unchanged]
            value: null
          - path: [layout_phase]
            value: 2
          - path: [state_phase]
            value: 4
      - type: file_contains
        path: skills/ui-template-apply/references/apply-workflow.md
        all: ["layout profile 语义变化", "geometry/state profile 语义变化", "structural fidelity unavailable"]
        none: []
