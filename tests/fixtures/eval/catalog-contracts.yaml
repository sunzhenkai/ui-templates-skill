schema_version: 1
cases:
  authoring-catalog-zero-drift:
    assertions:
      - type: python_call
        operation: catalog_zero_drift
        json_path_equals:
          - path: [matched]
            value: true
          - path: [drift_detected]
            value: true
  apply-catalog-pin-from-empty-project:
    assertions:
      - type: python_call
        operation: catalog_seed_contracts
        json_path_equals:
          - path: [empty_resolved]
            value: true
          - path: [empty_no_templates]
            value: true
          - path: [project_preferred]
            value: true
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all:
          - 只读 pin
          - 不写入项目 `templates/`
          - 空项目缺 `templates/` 不是失败
        none:
          - 从 catalog 播种
  apply-no-template-only-when-absent-from-catalog:
    assertions:
      - type: python_call
        operation: catalog_seed_contracts
        json_path_equals:
          - path: [missing_handoff]
            value: true
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all:
          - 移交 Authoring
          - catalog
        none: []
  apply-catalog-adopt-portable:
    assertions:
      - type: python_call
        operation: catalog_seed_contracts
        json_path_equals:
          - path: [explicit_seeded]
            value: true
          - path: [second_seed_skipped]
            value: true
          - path: [existing_not_overwritten]
            value: true
          - path: [retired_blocked]
            value: true
      - type: file_contains
        path: skills/ui-template-author/references/template-lifecycle.md
        all:
          - 显式领养
          - 已有同名行或目录不覆盖
          - retired 行不救回
          - portable validator
