schema_version: 2
themes:
  light:
    background: {value: "#ffffff", origin: source}
    foreground: {value: "#000000", origin: source}
    muted-foreground: {value: "oklch(0.30 0 0)", origin: source}
    ring: {value: "#000000", origin: source}
    sidebar-hover: {value: "#f3f4f6", origin: source}
  dark:
    background: {value: "#000000", origin: source}
    foreground: {value: "#ffffff", origin: source}
    muted-foreground: {value: "oklch(0.80 0 0)", origin: source}
    ring: {value: "#ffffff", origin: source}
