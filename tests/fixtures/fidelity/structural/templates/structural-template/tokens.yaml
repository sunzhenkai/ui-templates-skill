spacing:
  base: {value: 4, unit: px, origin: source}
  allowed: {value: [4, 8, 16], unit: px, origin: source}
  dialog:
    block-start: {value: 24, unit: px, origin: source}
    inline-end: {value: 24, unit: px, origin: source}
    block-end: {value: 16, unit: px, origin: source}
