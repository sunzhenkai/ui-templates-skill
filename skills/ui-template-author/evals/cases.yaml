schema_version: 1
skill: ui-template-author
revision: harden-template-lifecycle-eval-v1
cases:
  - id: authoring-updates-index
    skill: ui-template-author
    category: validation-gate
    description: Authoring 完成后必须更新 templates/INDEX.md 并汇报模板路径、关键 token 与估算值。
    given: 完成一个模板的 Authoring
    fixture: tests/fixtures/eval/script-contracts.yaml#authoring-updates-index
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - templates/INDEX.md 包含新模板行（名称/风格描述/来源类型/采集日期）
        - '汇报包含模板路径、关键 token 摘要、默认值（origin: default）、估算值与 coverage 说明'
      must_not: []
    revision: harden-template-lifecycle-eval-v1
  - id: no-apply-handoff-after-authoring
    skill: ui-template-author
    category: routing
    description: Authoring 完成后若用户要继续落地页面，必须移交 ui-template-apply。
    given: 模板创建完成且用户希望按该模板实现页面
    fixture: tests/fixtures/eval/script-contracts.yaml#no-apply-handoff-after-authoring
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - 提示由 ui-template-apply 承接后续实现
      must_not:
        - 在本 skill 内展开 Apply 阶段流程
    revision: harden-template-lifecycle-eval-v1
  - id: estimated-values-labeled
    skill: ui-template-author
    category: origin
    description: 反推或估算值必须标注 (估算)，不得冒充精确值。
    given: 从图片反推色值或字号
    fixture: tests/fixtures/eval/llm-contracts.yaml#estimated-values-labeled
    fixture_sha256: d7637a9e3389bd851b4a7c92ae9b5713a98f2e96e9eb6f1f419b3044ed3ae2c3
    judge: llm
    expect:
      must:
        - 估算值后标注 (估算)
      must_not:
        - 将估算值表述为精确值而不注明出处
    revision: harden-template-lifecycle-eval-v1
  - id: existing-template-ask-update-or-new
    skill: ui-template-author
    category: routing
    description: 目标模板目录已存在时必须询问更新还是另建。
    given: 用户要求创建 templates/<name>/ 且该目录已存在
    fixture: tests/fixtures/eval/llm-contracts.yaml#existing-template-ask-update-or-new
    fixture_sha256: d7637a9e3389bd851b4a7c92ae9b5713a98f2e96e9eb6f1f419b3044ed3ae2c3
    judge: llm
    expect:
      must:
        - 询问用户是更新现有模板还是另建新模板
      must_not:
        - 未经确认直接覆盖已有模板内容
    revision: harden-template-lifecycle-eval-v1
  - id: tokens-yaml-required-and-complete
    skill: ui-template-author
    category: schema
    description: 每个模板必备 tokens.yaml 且关键维度无空值。
    given: 创建或更新任意 UI 模板。
    fixture: tests/fixtures/eval/script-contracts.yaml#tokens-yaml-required-and-complete
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - templates/<name>/tokens.yaml 存在
        - 颜色、字体族、字号阶梯、间距、圆角、阴影的 token 均有具体值与 origin
        - 双主题存在时 light 与 dark 的角色键一致
      must_not:
        - 关键字段留空或只写区间
        - 把来源未体现写成“消费方自选”的最终状态
    revision: harden-template-lifecycle-eval-v1
  - id: authoring-normalizes-and-fills-defaults
    skill: ui-template-author
    category: origin
    description: Authoring 在提取后必须执行归一与决策，消除自由裁量。
    given: 完成来源提取并准备生成模板。
    fixture: tests/fixtures/eval/script-contracts.yaml#authoring-normalizes-and-fills-defaults
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - 近义色合并、间距归基数、字号收敛为不超过 10 档
        - 缺口字段回填默认值并在决策记录说明理由
        - 交互组件补齐 hover、focus-visible、disabled、selected
        - meta.yaml coverage 区分 observed 与 defaulted
      must_not:
        - 跳过归一与决策直接生成模板
        - 把 WCAG 不达标组合带入 Apply
    revision: harden-template-lifecycle-eval-v1
  - id: no-engineering-structure-in-template
    skill: ui-template-author
    category: prohibited-content
    description: 模板不承载消费项目的工程结构。
    given: 创建或更新模板的 apply/ 或 components.md。
    fixture: tests/fixtures/eval/script-contracts.yaml#no-engineering-structure-in-template
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - apply/ 只写实施顺序、阶段 gate 与验收引用
        - components.md 只写设计契约，不含组件库来源映射
      must_not:
        - 放置目录契约、API/mock/data 分层、状态库选型或 stack adapter
        - 把具体消费项目的业务域名写入模板
    revision: harden-template-lifecycle-eval-v1
  - id: doc-source-routed-correctly
    skill: ui-template-author
    category: routing
    description: 纯设计文档不得按 repo 来源空转。
    given: 用户提供的来源是 Markdown/PDF 设计文档而非代码仓库。
    fixture: tests/fixtures/eval/script-contracts.yaml#doc-source-routed-correctly
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - 按 references/source-doc.md 提取
        - '视觉缺口回填 origin: default 并拆分 layout/visual 置信度'
      must_not:
        - 登记为 repo 来源后留下大量“来源未体现”缺口
    revision: harden-template-lifecycle-eval-v1
  - id: authoring-out-of-scope-rejected
    skill: ui-template-author
    category: routing
    description: 与模板创建、导入、更新或浏览无关的任务不使用本 skill。
    given: 请求与 UI 模板库维护无关
    fixture: tests/fixtures/eval/script-contracts.yaml#authoring-out-of-scope-rejected
    fixture_sha256: fb8289a210f8c8ed1dc84f3b4748a1a0a308b9fe8ad97387d404d6470e37090c
    judge: script
    expect:
      must:
        - 判定不适用本 skill 并说明原因
        - 用已有模板实现页面的意图移交 ui-template-apply
      must_not:
        - 强行套用 Authoring 工作流
    revision: harden-template-lifecycle-eval-v1
  - id: authoring-template-lifecycle-verbs
    skill: ui-template-author
    category: routing
    description: Authoring 必须提供浏览、退役与删除手续，INDEX 带 published/retired。
    given: 用户要求退役或删除已发布模板
    fixture: tests/fixtures/eval/loop-contracts.yaml#authoring-template-lifecycle-verbs
    fixture_sha256: 200ee3a4a615f10d4fd5043d1eba58c610428ddf2efaf815f0005b940a83924b
    judge: script
    expect:
      must:
        - 提供 retire/delete 动词与 INDEX 状态列
        - 通过 manage_template_index.py 变更生产 INDEX
      must_not:
        - 直接删除 published 模板而不先退役
    revision: harden-template-lifecycle-eval-v1
  - id: authoring-layered-extraction
    skill: ui-template-author
    category: routing
    description: 从源更新必须冻结变更集合，未声明文件保持原字节。
    given: 用户要求从源更新模板的部分组件
    fixture: tests/fixtures/eval/loop-contracts.yaml#authoring-layered-extraction
    fixture_sha256: 200ee3a4a615f10d4fd5043d1eba58c610428ddf2efaf815f0005b940a83924b
    judge: script
    expect:
      must:
        - Intake 冻结本次变更集合
        - 未纳入集合的文件保持原字节
      must_not:
        - 用 3–5 个代表组件冒充完整 coverage
    revision: harden-template-lifecycle-eval-v1
