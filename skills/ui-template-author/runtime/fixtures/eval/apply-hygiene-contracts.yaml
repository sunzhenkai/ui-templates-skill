schema_version: 1
cases:
  apply-greenfield-architecture-gate:
    assertions:
      - type: python_call
        operation: apply_architecture_contracts
        json_path_equals:
          - path: [empty_greenfield]
            value: true
          - path: [placeholder_greenfield]
            value: true
          - path: [ledger_ignored]
            value: true
          - path: [package_json_existing]
            value: true
          - path: [explicit_keeps_named_greenfield]
            value: true
          - path: [named_stack_preserved]
            value: true
          - path: [architecture_schema_ok]
            value: true
          - path: [unconfirmed_schema_ok]
            value: true
          - path: [existing_schema_ok]
            value: true
          - path: [unconfirmed_blocks_complete]
            value: true
      - type: json_schema_validity
        schema: schemas/template/v2/architecture.schema.json
        valid: true
        instance:
          schema_version: 2
          site: greenfield
          confirmed_by_user: true
          build_identity: build:eval
          layers:
            language: typescript
            ui_framework: vue
            bundler: vite
            routing: vue-router
            styling: css
            state: none
            data: fetch
            unit_test: vitest
            browser: playwright
            package_manager: npm
            repo_shape: single-package
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all:
          - 未确认不得写应用源码
          - 已有工程只记录观察到的栈
          - 禁止静默换栈
        none:
          - 默认 React
      - type: file_contains
        path: skills/ui-template-apply/references/apply-workflow.md
        all:
          - 不得写依赖清单
          - 不得把任何栈写成 Apply 默认
          - 只记录观察到的栈
  apply-session-closed-delete-hint:
    assertions:
      - type: python_call
        operation: apply_close_contracts
        json_path_equals:
          - path: [incomplete_open]
            value: true
          - path: [proposed_open]
            value: true
          - path: [closed_ok]
            value: true
          - path: [closed_hint]
            value: true
          - path: [no_auto_delete]
            value: true
          - path: [templates_not_auto_deleted]
            value: true
      - type: file_contains
        path: skills/ui-template-apply/SKILL.md
        all:
          - "session_closed: true"
          - "may_delete_apply_root: true"
          - 可以删除整个 .ui-template-apply/；删除后生成页面不受影响；再次 Apply 视为新 Intake。
          - 本仓不应存在 `templates/`
          - 也不得说会话可删
        none:
          - 自动删除 .ui-template-apply
