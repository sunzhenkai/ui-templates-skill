version: 1
skill: ui-template
cases:
  - id: authoring-updates-index
    kind: core
    judge: deterministic
    description: Authoring 完成后必须更新 templates/INDEX.md 并汇报模板路径、关键 token 与估算值。
    given: 完成一个模板的 Authoring
    expect:
      must:
        - templates/INDEX.md 包含新模板行（名称/风格描述/来源类型/采集日期）
        - 汇报包含模板路径、关键 token 摘要、默认值（origin: default）、估算值与 coverage 说明
      must_not: []
  - id: no-apply-handoff-after-authoring
    kind: failure
    judge: deterministic
    description: Authoring 完成后若用户要继续落地页面，必须移交 ui-template-apply。
    given: 模板创建完成且用户希望按该模板实现页面
    expect:
      must:
        - 提示由 ui-template-apply 承接后续实现
      must_not:
        - 在本 skill 内展开 Apply 阶段流程
  - id: estimated-values-labeled
    kind: failure
    judge: deterministic
    description: 反推或估算值必须标注 (估算)，不得冒充精确值。
    given: 从图片反推色值或字号
    expect:
      must:
        - 估算值后标注 (估算)
      must_not:
        - 将估算值表述为精确值而不注明出处
  - id: existing-template-ask-update-or-new
    kind: boundary
    judge: deterministic
    description: 目标模板目录已存在时必须询问更新还是另建。
    given: 用户要求创建 templates/<name>/ 且该目录已存在
    expect:
      must:
        - 询问用户是更新现有模板还是另建新模板
      must_not:
        - 未经确认直接覆盖已有模板内容
  - id: tokens-yaml-required-and-complete
    kind: core
    judge: deterministic
    description: 每个模板必备 tokens.yaml 且关键维度无空值。
    given: 创建或更新任意 UI 模板。
    expect:
      must:
        - templates/<name>/tokens.yaml 存在
        - 颜色、字体族、字号阶梯、间距、圆角、阴影的 token 均有具体值与 origin
        - 双主题存在时 light 与 dark 的角色键一致
      must_not:
        - 关键字段留空或只写区间
        - 把来源未体现写成"消费方自选"的最终状态
  - id: authoring-normalizes-and-fills-defaults
    kind: core
    judge: deterministic
    description: Authoring 在提取后必须执行归一与决策，消除自由裁量。
    given: 完成来源提取并准备生成模板。
    expect:
      must:
        - 近义色合并、间距归基数、字号收敛为不超过 10 档
        - 缺口字段回填默认值并在决策记录说明理由
        - 交互组件补齐 hover、focus-visible、disabled、selected
        - meta.yaml coverage 区分 observed 与 defaulted
      must_not:
        - 跳过归一与决策直接生成模板
        - 把 WCAG 不达标组合带入 Apply
  - id: no-engineering-structure-in-template
    kind: core
    judge: deterministic
    description: 模板不承载消费项目的工程结构。
    given: 创建或更新模板的 apply/ 或 components.md。
    expect:
      must:
        - apply/ 只写实施顺序、阶段 gate 与验收引用
        - components.md 只写设计契约，不含组件库来源映射
      must_not:
        - 放置目录契约、API/mock/data 分层、状态库选型或 stack adapter
        - 把具体消费项目的业务域名写入模板
  - id: doc-source-routed-correctly
    kind: failure
    judge: deterministic
    description: 纯设计文档不得按 repo 来源空转。
    given: 用户提供的来源是 Markdown/PDF 设计文档而非代码仓库。
    expect:
      must:
        - 按 references/source-doc.md 提取
        - 视觉缺口回填 origin: default 并拆分 layout/visual 置信度
      must_not:
        - 登记为 repo 来源后留下大量"来源未体现"缺口
  - id: out-of-scope-rejected
    kind: boundary
    judge: deterministic
    description: 与模板创建、导入、更新或浏览无关的任务不使用本 skill。
    given: 请求与 UI 模板库维护无关
    expect:
      must:
        - 判定不适用本 skill 并说明原因
        - 用已有模板实现页面的意图移交 ui-template-apply
      must_not:
        - 强行套用 Authoring 工作流
