schema_version: 1
skill: ui-template-apply
revision: close-state-presentation-blind-spots
cases:
  - id: apply-requires-reference-reading
    skill: ui-template-apply
    category: installation
    description: Template Apply 执行前必须完整阅读工作流、工具链、质量门禁与模板 spec。
    given: 用户要求使用已有模板实现页面
    fixture: tests/fixtures/eval/script-contracts.yaml#apply-requires-reference-reading
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 执行前已读取 references/apply-workflow.md
        - 执行前已读取 references/toolchain.md
        - 执行前已读取 references/quality-gates.md
        - 执行前已读取 templates/<name>/spec.md
        - 执行前已读取 templates/<name>/tokens.yaml
      must_not:
        - 未读上述文件即开始实现页面
    revision: close-state-presentation-blind-spots
  - id: apply-placement-closure
    skill: ui-template-apply
    category: checkpoint
    description: route/component placement 必须绑定 stable closure，unavailable 时不得断言机器 topology。
    given: Active Instance 提供 layout/Page Type/Pattern closure 或声明 structural fidelity unavailable
    fixture: tests/fixtures/eval/placement-contracts.yaml#apply-placement-closure
    fixture_sha256: f80d9872e8da4417dad6374123b22a9bcc516b60f50a7739eb0993fb56b14370
    judge: script
    expect:
      must:
        - Phase 2 记录 layout_ref、pattern_refs 和 structural_verification
        - placement-sensitive component 引用授权 Pattern
        - unavailable profile 不得输出 shell/topology 断言
      must_not:
        - 使用未声明 Pattern 或 prose slots 推导机器约束
    revision: close-state-presentation-blind-spots
  - id: no-apply-without-template
    skill: ui-template-apply
    category: routing
    description: 没有可用模板时必须提示先 Authoring，不得直接生成页面。
    given: 用户要求照某风格做页面但 templates/ 中无对应模板
    fixture: tests/fixtures/eval/script-contracts.yaml#no-apply-without-template
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 提示先由 ui-template-author 创建或扩展模板
        - 模板就绪后再进入本工作流
      must_not:
        - 在无模板时直接生成页面
    revision: close-state-presentation-blind-spots
  - id: no-phase-skipping
    skill: ui-template-apply
    category: checkpoint
    description: Apply 的 0-9 阶段不得跳过或提前。
    given: Template Apply 进行中且前一阶段产物未确认
    fixture: tests/fixtures/eval/script-contracts.yaml#no-phase-skipping
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 每阶段先产出核心产物再进入下一阶段
      must_not:
        - token 与 layout 未确认时生成页面
        - 跳过 Browser verification 宣称完成
    revision: close-state-presentation-blind-spots
  - id: browser-verification-evidence
    skill: ui-template-apply
    category: validation-gate
    description: 完成宣称必须附带真实浏览器验证证据。
    given: 一次 Template Apply 即将收尾
    fixture: tests/fixtures/eval/script-contracts.yaml#browser-verification-evidence
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 提供桌面、compact、mobile 多视口检查
        - console 无未处理错误
        - 可访问性树与 computed style 匹配模板 token
      must_not:
        - 仅以代码审查宣称完成
    revision: close-state-presentation-blind-spots
  - id: spec-wins-over-apply
    skill: ui-template-apply
    category: feedback
    description: spec.md 与 apply/ 或工程约定冲突时以 spec.md 为准。
    given: 模板 apply/ 说明或目标项目工程约定与 spec.md 规则冲突
    fixture: tests/fixtures/eval/script-contracts.yaml#spec-wins-over-apply
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 按 spec.md 规则执行
        - 向用户说明冲突与裁决依据
      must_not:
        - 按目标项目工程结构覆盖 spec.md 设计规则
    revision: close-state-presentation-blind-spots
  - id: routing-semantics-enforced
    skill: ui-template-apply
    category: routing
    description: 路由入口使用真实链接，当前项使用 aria-current，可恢复状态进入 URL。
    given: 实现跨页面导航与可恢复状态
    fixture: tests/fixtures/eval/script-contracts.yaml#routing-semantics-enforced
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 跨页面目的地使用真实 <a href>
        - 当前导航项含 aria-current="page"
        - 可恢复状态进入 URL
      must_not:
        - 用脚本模拟导航替代真实链接
    revision: close-state-presentation-blind-spots
  - id: apply-token-freeze
    skill: ui-template-apply
    category: origin
    description: Apply 的项目 token 必须冻结映射自 tokens.yaml。
    given: Template Apply Phase 1 产出 Design Direction
    fixture: tests/fixtures/eval/script-contracts.yaml#apply-token-freeze
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - token map 逐项覆盖 tokens.yaml
        - 新增值在 Implementation Brief 标注 new-token 并说明理由
      must_not:
        - 从 prose 重新演绎数值
        - 引入未解释的 arbitrary color、字号、间距或圆角
    revision: close-state-presentation-blind-spots
  - id: apply-style-consistency-contract
    skill: ui-template-apply
    category: validation-gate
    description: 同一语义角色的风格 treatment 必须由 local style rule 约束并用 current-build 证据复验。
    given: Template Apply 即将实现按钮、状态、输入或数据单元等多个同角色元素
    fixture: tests/fixtures/eval/apply-design-decision-contracts.yaml#apply-style-consistency-contract
    fixture_sha256: 82cb8395374efbdbafdb9383118c1550279f6c8f84a201b64acb63186942cd22
    judge: script
    expect:
      must:
        - Phase 1 建立 LOCAL-STYLE-### 并绑定组件族和 token/rule
        - 同一 semantic role 使用一致 typography、color、spacing、radius、border 和 shadow
        - Phase 8 用 computed style 复验风格漂移
      must_not:
        - 用组件库默认值解释未记录的风格差异
        - 以 prose“看起来一致”替代 current-build evidence
    revision: close-state-presentation-blind-spots
  - id: apply-information-semantics-contract
    skill: ui-template-apply
    category: validation-gate
    description: 状态、数据和操作必须按用户任务选择语义正确的展示元素。
    given: Template Apply 需要展示状态、比较数据、元数据或操作入口
    fixture: tests/fixtures/eval/apply-design-decision-contracts.yaml#apply-information-semantics-contract
    fixture_sha256: 82cb8395374efbdbafdb9383118c1550279f6c8f84a201b64acb63186942cd22
    judge: script
    expect:
      must:
        - Phase 4 记录候选语义元素、最终 primitive、信息角色和选择理由
        - 用 Accessibility tree 验证 role/name/state 和非颜色状态
        - 操作和跨页目的地分别使用语义正确的 button/link
      must_not:
        - 为装饰便利或组件库默认值选错信息元素
        - 让颜色成为唯一状态信号
    revision: close-state-presentation-blind-spots
  - id: apply-placement-review-contract
    skill: ui-template-apply
    category: validation-gate
    description: 主要信息、动作、分组和焦点顺序必须有 placement plan 并做多视口复验。
    given: Template Apply 即将组装 included route
    fixture: tests/fixtures/eval/apply-design-decision-contracts.yaml#apply-placement-review-contract
    fixture_sha256: 82cb8395374efbdbafdb9383118c1550279f6c8f84a201b64acb63186942cd22
    judge: script
    expect:
      must:
        - Phase 2 记录页面职责、主要信息、主要动作、信息分组和阅读/焦点顺序
        - 保留 fidelity 已声明的 shell、slot、anchor、scroll 和 overlay 约束
        - Phase 8/9 复验响应式降级和主要动作层级
      must_not:
        - 为视觉平衡打散任务组或降级主要动作
        - 用未声明的壳默认值替代模板结构约束
    revision: close-state-presentation-blind-spots
  - id: apply-out-of-scope-rejected
    skill: ui-template-apply
    category: routing
    description: 与用已有模板实现页面无关的任务不使用本 skill。
    given: 请求与模板消费落地无关
    fixture: tests/fixtures/eval/script-contracts.yaml#apply-out-of-scope-rejected
    fixture_sha256: 9e4296a2bb65648e62b475d13066030e73490ee60e7fa063707c153273aa7c57
    judge: script
    expect:
      must:
        - 判定不适用本 skill 并说明原因
        - 模板创建/导入意图移交 ui-template-author
      must_not:
        - 强行套用 Apply 工作流
    revision: close-state-presentation-blind-spots
  - id: apply-no-patch-generated-web
    skill: ui-template-apply
    category: feedback
    description: 保真差异不得通过修改生成 web 闭合。
    given: 对照原版发现视觉差异
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-no-patch-generated-web
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 差异回写 skill 或模板后重生
        - 生成物不是修复面
      must_not:
        - 直接修改 example/workbench-shell/web/src
    revision: close-state-presentation-blind-spots
  - id: apply-retired-template-rejected
    skill: ui-template-apply
    category: routing
    description: retired 模板不得进入新的 Apply Intake。
    given: 用户要求用 INDEX 状态为 retired 的模板实现页面
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-retired-template-rejected
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - Intake 检查 INDEX 状态
        - retired 时停止
      must_not:
        - 继续 Phase 1
    revision: close-state-presentation-blind-spots
  - id: apply-original-alignment-handoff
    skill: ui-template-apply
    category: routing
    description: 用户要求对齐原版视觉时，Apply 仍只消费 Active Instance 并移交模板认证链路。
    given: 用户明确要求生成页面与可部署原版对齐
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-original-alignment-handoff
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 只消费 digest 一致 Active Instance 继续 Phase 0-9
        - 将原版对照需求移交 Template Certification Gate
      must_not:
        - 定义或执行 source oracle 对照模式
        - 读取原版 checkout 或 meta.sources 实现路径
    revision: close-state-presentation-blind-spots
  - id: apply-source-blind-rejection
    skill: ui-template-apply
    category: validation-gate
    description: source oracle、历史生成物或 source-compare artifact 进入 Apply checkpoint 时 fail closed。
    given: Apply checkpoint 试图引用 oracle revision 或保存 source-compare.yaml
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-source-blind-rejection
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 报告 SOURCE_BLIND_VIOLATION 并停止实现
        - 拒绝 example/** 或历史 web-v* 输出根
      must_not:
        - 允许对照结论进入实现依据
    revision: close-state-presentation-blind-spots
  - id: apply-pattern-bound-composition
    skill: ui-template-apply
    category: checkpoint
    description: included route 必须映射到已声明 Page Type 且引用的 Pattern/Primitive 可解析。
    given: Active Instance 声明了 page-type/dashboard、pattern/dashboard-shell 与 primitive/panel
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-pattern-bound-composition
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 每个 included route 声明已存在 Page Type
        - 组件引用解析到 Active Instance 的 Stable Entity ID
      must_not:
        - 允许悬空 Page Type 或 Pattern 引用通过 checkpoint
    revision: close-state-presentation-blind-spots
  - id: apply-missing-reusable-control-feedback
    skill: ui-template-apply
    category: feedback
    description: 页面缺少模板未声明的可复用交互控件时，停止复用层实现并生成 package feedback。
    given: 页面需要 Active Instance 未声明的可复用交互控件
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-missing-reusable-control-feedback
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 停止该复用层实现
        - 创建引用 Stable Entity ID 语义的 design-system-feedback proposed 记录
      must_not:
        - 私造新的 reusable semantic 层
        - 用业务页特例替代可复用契约
    revision: close-state-presentation-blind-spots
  - id: apply-no-source-checkout
    skill: ui-template-apply
    category: routing
    description: Apply 实现时不得读取原版 checkout 或历史生成 web。
    given: 工作区同时存在模板 provenance 与 example web
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-no-source-checkout
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 禁止原版 checkout 与历史 web 作为实现输入
      must_not:
        - 按 meta.sources[] 打开本地绝对路径
    revision: close-state-presentation-blind-spots
  - id: apply-catalog-pin-from-empty-project
    skill: ui-template-apply
    category: routing
    description: 空项目从 Author catalog pin published 模板完成 Intake，不创建项目 templates/。
    given: 新项目安装双 skill 且本地 templates/ 为空
    fixture: tests/fixtures/eval/catalog-contracts.yaml#apply-catalog-pin-from-empty-project
    fixture_sha256: 1caa4cd8dd8e6872fec049d11a9a8d0ab76571e683a6193799fb9bd334cff36c
    judge: script
    expect:
      must:
        - 只读 catalog pin workbench-shell 或等价 published 模板
        - 不创建项目 templates/
        - 项目 published 行优先
      must_not:
        - 把空项目当成没有模板
        - 为消费播种项目库
    revision: close-state-presentation-blind-spots
  - id: apply-no-template-only-when-absent-from-catalog
    skill: ui-template-apply
    category: routing
    description: 只有项目库与 catalog 都没有目标 published 模板时才报没有模板并移交 Authoring。
    given: 用户要求用一个 catalog 与项目库都不存在的模板名
    fixture: tests/fixtures/eval/catalog-contracts.yaml#apply-no-template-only-when-absent-from-catalog
    fixture_sha256: 1caa4cd8dd8e6872fec049d11a9a8d0ab76571e683a6193799fb9bd334cff36c
    judge: script
    expect:
      must:
        - 报 TEMPLATE_NOT_IN_CATALOG 或等价“没有模板”
        - 移交 ui-template-author
      must_not:
        - catalog 已有官方模板时停止并声称没有模板
    revision: close-state-presentation-blind-spots
  - id: apply-greenfield-architecture-gate
    skill: ui-template-apply
    category: checkpoint
    description: greenfield 未确认不得写依赖清单；用户点名栈不得被改成另一套默认；existing 不跑选型；嵌套空输出根仍要选型。
    given: 空目录、已有 package.json 的输出根，或已初始化 monorepo 里的空前端应用要求用 published 模板实现页面
    fixture: tests/fixtures/eval/apply-hygiene-contracts.yaml#apply-greenfield-architecture-gate
    fixture_sha256: ad3995efca8d4cf71989befe3b194378c57f95a925e2341c642855d7190fdc68
    judge: script
    expect:
      must:
        - 空仓判定 greenfield 并等待架构确认
        - 用户点名的 UI 框架保持不变
        - 已有依赖清单只记录 observed stack
        - 仓库已初始化但空输出根仍判定 greenfield
        - 含 .ui-template-design Active Instance 的输出根仍判定 greenfield
      must_not:
        - 未确认时创建 package.json
        - 把用户点名栈改成另一套默认
        - 对 existing 输出根跑选型访谈
        - 因仓库根有 package.json 跳过新应用选型
    revision: close-state-presentation-blind-spots
  - id: apply-session-closed-delete-hint
    skill: ui-template-apply
    category: feedback
    description: Phase 9 closed 且无 proposed 时汇报可删 .ui-template-apply/；未 closed 不得宣称可删。
    given: Apply 收尾或仍有 proposed feedback
    fixture: tests/fixtures/eval/apply-hygiene-contracts.yaml#apply-session-closed-delete-hint
    fixture_sha256: ad3995efca8d4cf71989befe3b194378c57f95a925e2341c642855d7190fdc68
    judge: script
    expect:
      must:
        - closed 汇报含可删除 .ui-template-apply/
        - 未领养时说明不应有 templates/
      must_not:
        - 未 closed 时宣称会话可删
        - 自动删除账本或项目库
    revision: close-state-presentation-blind-spots
  - id: apply-catalog-adopt-portable
    skill: ui-template-apply
    category: validation-gate
    description: 显式 seed/领养后项目库可走 INDEX/core 校验；retired 仍拒绝。
    given: 用户明确把官方模板接到本仓，或项目行已 retired
    fixture: tests/fixtures/eval/catalog-contracts.yaml#apply-catalog-adopt-portable
    fixture_sha256: 1caa4cd8dd8e6872fec049d11a9a8d0ab76571e683a6193799fb9bd334cff36c
    judge: script
    expect:
      must:
        - 显式 seed 写入项目库与 INDEX
        - 已有同名行或目录不覆盖
        - retired 拒绝且不救回
      must_not:
        - Apply Intake 默默播种
    revision: close-state-presentation-blind-spots
  - id: apply-scenario-derivation
    skill: ui-template-apply
    category: checkpoint
    description: Phase 8 required scenarios 必须覆盖 placement geometry token 与 pattern 闭包。
    given: Active Instance 的 layout placement 声明 geometry token 与 pattern_refs
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-scenario-derivation
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 派生集合包含 placement geometry 场景
        - 派生集合包含 pattern 存在性场景
      must_not:
        - 派生集合缩窄为与 fidelity 同盲的最小集
    revision: close-state-presentation-blind-spots
  - id: apply-control-styling-contracts
    skill: ui-template-apply
    category: checkpoint
    description: scroll_owner 对账、多窗格根要求与全局机制 CSS 禁令。
    given: layout 声明双 scroll domain 与单 owner 两种场景；全局与作用域 CSS 各一
    fixture: tests/fixtures/eval/loop-contracts.yaml#apply-control-styling-contracts
    fixture_sha256: b696ad5df8669a59a4d8aea13a4c4f0ac380c94c104b1162ee312b609bfd0afb
    judge: script
    expect:
      must:
        - 未声明 owner 的 scroll_owner 报 SCROLL_OWNER_UNTRACE
        - 多窗格未声明 multi_pane 报 MULTI_PANE_ROOT_REQUIRED
        - 裸伪类全局 outline 发明被检出，作用域样式放行
      must_not:
        - 复用壳级单一滚动容器承载多窗格 layout
    revision: close-state-presentation-blind-spots
