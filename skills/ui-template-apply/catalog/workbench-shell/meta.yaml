schema: ui-template/v4
name: workbench-shell
version: 5.0.4
summary: Neutral gray workbench with a restrained blue accent; sidebar shell, dense lists, quiet chrome.
fits:
  - internal tools, admin consoles, operator / agent workbenches
  - list → detail → form flows, logs, conversations
not_for:
  - marketing sites, content-first reading products, consumer brand experiences
base:
  registry: shadcn
  cli: shadcn@4.21.4
  base: radix
  style: nova
density: compact          # body 13px (text-sm), controls h-8 (32px), table rows 36px
theme: theme.css
defaults:                 # decisions a pattern would otherwise ask; projects may override in ui-decisions.yaml
  shell.sidebar: inset            # shadcn Sidebar variant="inset"; collapsible="icon"
  shell.canvas: app-shell         # outer gray, page sits on bg-background
  collection.frame: bordered      # framed table (border, radius, header band); flush inside a Card
  collection.row_height: 36
  collection.paging: load_more
  detail.layout: header-tabs
  form.layout: single-column
  confirm.irreversible: type_to_confirm
  feedback.channel: toast
sources:
  - kind: oss-repo
    ref: multica (packages/ui/styles/tokens.css)   # neutral palette, chart ramp, shell/canvas split
    license: Apache-2.0
  - kind: registry
    ref: shadcn/ui radix-nova 4.21.4
    license: MIT
changelog: CHANGELOG.md
