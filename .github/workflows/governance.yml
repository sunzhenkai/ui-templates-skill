name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml==6.0.2 playwright==1.55.0 && python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lint-rule test harness
        run: mkdir -p /tmp/eslint-harness && cd /tmp/eslint-harness && npm init -y >/dev/null && npm i eslint@9 typescript-eslint@8 typescript@5
      - run: make check
        env:
          UI_TEMPLATE_ESLINT_DIR: /tmp/eslint-harness
